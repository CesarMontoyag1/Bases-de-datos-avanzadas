# ============================================================
# postgresql.conf — REPLICA NODE (hot standby)
# Todos los parámetros >= primary para evitar "insufficient parameter"
# ============================================================

listen_addresses            = '*'
port                        = 5432
max_connections             = 200        # igual al primary
max_prepared_transactions   = 50         # igual al primary (necesario para 2PC)
max_wal_senders             = 5          # igual al primary
max_replication_slots       = 5          # igual al primary

# Modo standby
hot_standby                 = on
hot_standby_feedback        = on
default_transaction_read_only = on

# Logging a stdout (sin logging_collector para Docker)
log_destination             = 'stderr'
logging_collector           = off
log_min_duration_statement  = 100

shared_buffers              = 128MB
effective_cache_size        = 256MB