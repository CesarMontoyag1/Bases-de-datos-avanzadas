# ============================================================
# postgresql.conf — PRIMARY NODE
# Proyecto 2 BDD Avanzadas - Banca
# ============================================================

# ── Conexiones ──────────────────────────────────────────────
listen_addresses = '*'
max_connections  = 200
port             = 5432

# ── WAL y Replicación ───────────────────────────────────────
wal_level               = replica
max_wal_senders         = 5
wal_keep_size           = 256MB
max_replication_slots   = 5

# ── synchronous_commit ──────────────────────────────────────
# EXPERIMENTO: cambiar entre 'on', 'local', 'remote_write', 'remote_apply'
# 'on'           = local WAL flush (default, más rápido)
# 'remote_write' = escribe en réplica síncrona antes de confirmar (latencia +)
# 'remote_apply' = réplica aplica antes de confirmar (máxima consistencia, latencia ++)
synchronous_commit = on

# Para activar réplica síncrona (replica1), descomentar:
# synchronous_standby_names = 'FIRST 1 (pg-replica1)'

# ── Rendimiento ─────────────────────────────────────────────
shared_buffers           = 256MB
effective_cache_size     = 512MB
work_mem                 = 4MB
maintenance_work_mem     = 64MB
checkpoint_completion_target = 0.9
wal_buffers              = 16MB

# ── Logging para experimentos ───────────────────────────────
log_destination          = 'stderr'
logging_collector        = on
log_directory            = 'pg_log'
log_filename             = 'postgresql-%Y-%m-%d.log'
log_min_duration_statement = 100   # logear queries > 100ms
log_checkpoints          = on
log_connections          = on
log_disconnections       = on
log_lock_waits           = on

# ── 2PC (Two-Phase Commit) ──────────────────────────────────
max_prepared_transactions = 50
